# Raspberry Pi/Linux product profile consumed by eidolon-hub.service.
onboarding:
  hub_id: eidolon-hub-local
  # The image/provisioner must replace this with the product's reachable HTTPS name.
  public_base_url: https://eidolon-hub.local
  retrieval_window_seconds: 1800
discovery:
  mdns:
    enabled: true
channel_provider:
  contract_url: http://127.0.0.1:8767/v1
persistence:
  path: /var/lib/eidolon/eidolon-hub.sqlite3
