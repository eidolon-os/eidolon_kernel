version: 1
services:
  - service_id: data
    description: System Data and Companion identity authority
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      supervisord: data:data-api
    endpoints:
      - endpoint_id: companion-authority.http
        protocol: http
        address: http://127.0.0.1:8084
        contract: https://eidolon.dev/data/contracts/v1/companion/identity.schema.json
        health_url: http://127.0.0.1:8084/health
      - endpoint_id: companion-runtime-authority.http
        protocol: http
        address: http://127.0.0.1:8084
        contract: https://eidolon.dev/data/contracts/v1/companion/runtime-snapshot.schema.json
        health_url: http://127.0.0.1:8084/health
  - service_id: data-workspace
    description: System Data workspace onboarding write authority
    required: true
    enabled_by_default: true
    dependencies: [data]
    host_targets:
      supervisord: data:data-workspace-api
    endpoints:
      - endpoint_id: workspace-authority.http
        protocol: http
        address: http://127.0.0.1:8085
        contract: https://eidolon.live/contracts/system-data/workspace/onboarding-operation-v1.schema.json
        health_url: http://127.0.0.1:8085/health
  - service_id: hub
    description: Device onboarding, registry and policy authority
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      supervisord: hub:hub-api
    endpoints:
      - endpoint_id: device-authority.http
        protocol: http
        address: http://127.0.0.1:8082
        contract: eidolon.hub.device-directory.v1
        health_url: http://127.0.0.1:8082/health
  - service_id: kernel
    description: Sovereign namespace, Device Mount and authoritative state
    required: true
    enabled_by_default: true
    # Hub/Data availability gates specific mutations, not Kernel startup.
    dependencies: []
    host_targets:
      supervisord: kernel:kernel-api
    endpoints:
      - endpoint_id: device-mount.http
        protocol: http
        address: http://127.0.0.1:8083
        contract: eidolon.kernel.device-mount.v1
        health_url: http://127.0.0.1:8083/health
