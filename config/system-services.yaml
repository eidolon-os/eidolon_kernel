# What this Host runs, stated once for every host driver.
#
# There used to be two of these — this file for the macOS source run and a
# `system-services.systemd.example.yaml` for the Pi product image — and they
# disagreed about the service set itself, not just the driver: 4 services here
# against 11 there. Nothing compared them. `host_targets` is a map keyed by
# driver precisely so one manifest can name both mechanisms, so the two files
# are now one and the disagreement is no longer expressible.
#
# The reviewed systemd unit templates live under deploy/systemd; the image
# builder must install and verify them. The supervisord group:program targets
# are the macOS source topology Ops owns in
# eidolon_ops/deploy/supervisor/product-source.conf, and Ops' own test suite
# checks that every target named here exists there and is left for eidolond to
# start rather than auto-started behind its back.
#
# `external` is the one reserved target value: it says this driver does not
# manage the service on this kind of Host. eidolond never starts, stops or
# restarts it, still probes its health, and still gates dependents on it.
version: 1
services:
  - service_id: nats
    description: Agent and Memory asynchronous protocol broker with JetStream
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      systemd: eidolon-nats.service
      # A macOS source run shares one already-listening NATS with whatever
      # started it; run_all.sh gates on port 4222 rather than owning a process.
      supervisord: external
    endpoints:
      - endpoint_id: messaging.nats
        protocol: nats
        address: nats://127.0.0.1:4222
        contract: eidolon.agent-memory.nats.v1
        health_url: http://127.0.0.1:8222/healthz
  - service_id: livekit
    # LiveKit/Pion captures local interfaces when its transport is created.
    restart_on_network_change: true
    description: Local real-time media and room server
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      systemd: eidolon-livekit.service
      supervisord: livekit:livekit-server
    endpoints:
      - endpoint_id: media.livekit
        protocol: livekit
        address: ws://127.0.0.1:7880
        contract: livekit.protocol.v1
        health_url: http://127.0.0.1:7880/
  - service_id: memory-supervisor
    description: Memory Realm process reconciliation owner
    required: true
    enabled_by_default: true
    dependencies: [nats, memory-embedder]
    host_targets:
      systemd: eidolon-memory-supervisor.service
      supervisord: memory:memory-supervisor
    endpoints: []
  - service_id: memory-embedder
    description: Shared loopback BGE encoder for all Memory Realms
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      systemd: eidolon-memory-embedder.service
      supervisord: memory:memory-embedder
    endpoints:
      - endpoint_id: memory-embedding.http
        protocol: http
        address: http://127.0.0.1:8760/v1
        contract: openai.embeddings.v1
        health_url: http://127.0.0.1:8760/v1/health
  - service_id: memory-discovery
    description: Owner-scoped Memory routing discovery
    required: true
    enabled_by_default: true
    dependencies: [memory-supervisor]
    host_targets:
      systemd: eidolon-memory-discovery.service
      supervisord: memory:memory-discovery
    endpoints:
      - endpoint_id: memory-routing.http
        protocol: http
        address: http://127.0.0.1:8020
        contract: eidolon.memory.agent-routing.v1
        health_url: http://127.0.0.1:8020/api/discovery/agent-routing
  - service_id: data
    description: System Data and Companion identity authority
    required: true
    enabled_by_default: true
    dependencies: []
    host_targets:
      systemd: eidolon-data.service
      supervisord: data:data-api
    endpoints:
      - endpoint_id: companion-authority.http
        protocol: http
        address: http://127.0.0.1:8084
        contract: https://eidolon.dev/data/contracts/v1/companion/identity.schema.json
        health_url: http://127.0.0.1:8084/health
      - endpoint_id: companion-runtime-authority.http
        protocol: http
        address: http://127.0.0.1:8084
        contract: https://eidolon.dev/data/contracts/v1/companion/runtime-snapshot.schema.json
        health_url: http://127.0.0.1:8084/health
      - endpoint_id: memory-runtime-roster.http
        protocol: http
        address: http://127.0.0.1:8084
        contract: https://eidolon.dev/data/contracts/v1/memory/runtime-roster.schema.json
        health_url: http://127.0.0.1:8084/health
  - service_id: data-workspace
    description: System Data workspace onboarding write authority
    required: true
    enabled_by_default: true
    dependencies: [data]
    host_targets:
      systemd: eidolon-data-workspace.service
      supervisord: data:data-workspace-api
    endpoints:
      - endpoint_id: workspace-authority.http
        protocol: http
        address: http://127.0.0.1:8085
        contract: https://eidolon.live/contracts/system-data/workspace/onboarding-operation-v1.schema.json
        health_url: http://127.0.0.1:8085/health
  - service_id: hub
    description: Device onboarding, registry and policy authority
    required: true
    enabled_by_default: true
    # Claim/registry reads do not need media. Channel allocation checks its own
    # provider at the operation boundary; a media outage must not hide identity.
    dependencies: []
    host_targets:
      systemd: eidolon-hub.service
      supervisord: hub:hub-api
    endpoints:
      - endpoint_id: device-authority.http
        protocol: http
        address: http://127.0.0.1:8082
        contract: eidolon.hub.device-directory.v1
        health_url: http://127.0.0.1:8082/health
  - service_id: kernel
    description: Sovereign namespace, Device Mount and authoritative state
    required: true
    enabled_by_default: true
    # Hub/Data availability gates specific mutations, not Kernel startup.
    # Existing authoritative Mount reads remain available during an outage.
    dependencies: []
    host_targets:
      systemd: eidolon-kernel.service
      supervisord: kernel:kernel-api
    endpoints:
      - endpoint_id: device-mount.http
        protocol: http
        address: http://127.0.0.1:8083
        contract: eidolon.kernel.device-mount.v1
        health_url: http://127.0.0.1:8083/health
  - service_id: agent
    description: Companion brain and Agent runtime
    required: true
    enabled_by_default: true
    dependencies: [nats, memory-discovery, data]
    host_targets:
      systemd: eidolon-agent.service
      supervisord: agent:agent
    endpoints:
      - endpoint_id: companion-brain.grpc
        protocol: grpc
        address: 127.0.0.1:45051
        contract: eidolon.agent.rpc.v1
        health_url: http://127.0.0.1:8180/readyz
  # The one service not every Host runs. A board with an NPU listens with its
  # own models; a Host without one reaches a provider for the same thing and
  # carries none of this — no unit, no port, no weights.
  #
  # `requires_capability` is the same word the component's own
  # ops/component.toml uses for the same service, and a drift test holds the
  # two together. A Host that does not declare it has no such service here at
  # all: not a disabled one, because a listed service is still health-probed,
  # still gates dependents, and is still a unit the applier may actuate.
  #
  # Nothing depends on it yet. Nothing unconditional may: the manifest is
  # refused if a service every Host runs names a dependency only some have.
  - service_id: asr
    description: Local streaming speech recognition on this Host's own models
    required: true
    enabled_by_default: true
    requires_capability: local_asr
    dependencies: []
    host_targets:
      systemd: eidolon-asr.service
      # No macOS source topology for it: the weights are NPU artifacts and a
      # workstation has no NPU to load them with.
      supervisord: external
    endpoints:
      - endpoint_id: asr.stream
        protocol: websocket
        address: 127.0.0.1:8768
        contract: eidolon.models.asr.v1
        health_url: http://127.0.0.1:8768/readyz
  # The second of the same kind, and conditional for the same reason. The Agent
  # reaches it as an OpenAI-compatible endpoint, exactly as it reaches a hosted
  # model, so nothing downstream is aware of which one a Host has.
  - service_id: llm
    description: Local text generation on this Host's own weights
    required: true
    enabled_by_default: true
    requires_capability: local_llm
    dependencies: []
    host_targets:
      systemd: eidolon-llm.service
      # As with ASR: no workstation topology. The weights are pinned to the
      # board's little cores, and the dev stack reaches a hosted model.
      supervisord: external
    endpoints:
      - endpoint_id: llm.openai
        protocol: http
        address: 127.0.0.1:8769
        # Not a contract of ours: this is the OpenAI chat-completions surface,
        # which is the whole reason the Agent needs no code for it.
        contract: openai.chat.v1
        health_url: http://127.0.0.1:8769/health
  # The third of the same kind. Channel reaches it through a provider named
  # after the capability, exactly as it reaches a hosted voice, so nothing
  # downstream is aware of which one a Host has.
  - service_id: tts
    description: Local streaming speech synthesis on this Host's own weights
    required: true
    enabled_by_default: true
    requires_capability: local_tts
    dependencies: []
    host_targets:
      systemd: eidolon-tts.service
      # As with ASR and the LLM: no workstation topology. The engine loads RKNN
      # graphs onto an NPU a workstation does not have.
      supervisord: external
    endpoints:
      - endpoint_id: tts.stream
        protocol: websocket
        address: 127.0.0.1:8770
        contract: eidolon.models.tts.v1
        health_url: http://127.0.0.1:8770/readyz
  - service_id: laya
    description: Local decision suggestions for Agent shadow interpretation
    required: true
    enabled_by_default: true
    requires_capability: local_laya
    dependencies: []
    host_targets:
      systemd: eidolon-laya.service
      # macOS keeps the existing standalone laya source launcher; an explicit
      # local_laya opt-in still probes it, but eidolond does not own its process.
      supervisord: external
    endpoints:
      - endpoint_id: decision.laya.http
        protocol: http
        address: http://127.0.0.1:8771
        contract: eidolon.models.laya.systemone.v1
        health_url: http://127.0.0.1:8771/readyz
  - service_id: channel
    description: LiveKit voice interaction worker
    required: true
    enabled_by_default: true
    dependencies: [livekit, agent, data, kernel]
    host_targets:
      systemd: eidolon-channel.service
      supervisord: channel:channel-worker
    endpoints: []
  - service_id: channel-provider
    description: Hub-owned provisioning adapter for device LiveKit channels
    required: true
    enabled_by_default: true
    dependencies: [livekit]
    host_targets:
      systemd: eidolon-channel-provider.service
      supervisord: channel-provider:channel-provider
    endpoints:
      - endpoint_id: device-channel-provider.http
        protocol: http
        address: http://127.0.0.1:8767
        contract: application/vnd.eidolon.livekit-device+json;v=1
        health_url: http://127.0.0.1:8767/health
