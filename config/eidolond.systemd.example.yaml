# Raspberry Pi/Linux product profile. Installed systemd units are host mechanisms;
# desired enablement remains authoritative in eidolond SQLite.
manifest:
  path: system-services.yaml
persistence:
  path: /var/lib/eidolon/eidolond.sqlite3
host:
  driver: systemd
  systemctl: /usr/bin/systemctl
  # eidolond runs as `eidolon` with NoNewPrivileges, so start/stop/restart are
  # applied by the root applier on this socket. `systemctl show` still runs
  # here: reading a unit's state needs no privilege.
  unit_applier_socket: /run/eidolon-unit-applier.sock
  command_timeout_seconds: 20
reconciliation:
  interval_seconds: 5
  readiness_timeout_seconds: 3
interface:
  host: 127.0.0.1
  port: 8090
  uds: /run/eidolon/system.sock
  # Requires the service unit to run with the intended eidolon user/group.
  uds_mode: "0660"
