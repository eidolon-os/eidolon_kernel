persistence:
  path: var/eidolon-kernel.sqlite3
system_directory:
  base_url: http://eidolond
  uds_path: var/eidolond.sock
  timeout_seconds: 2.0
hub:
  timeout_seconds: 3.0
companion_authority:
  timeout_seconds: 3.0
reconciliation:
  interval_seconds: 30.0
deployment:
  mode: trusted-local
  trusted_local_ingress: true
