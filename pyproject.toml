[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-kernel"
version = "0.1.0"
description = "Eidolon OS sovereign microkernel control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "fastapi>=0.109",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
eidolond = "eidolon_system.main:run"
eidolon-release = "eidolon_deploy.cli:run"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.3",
    "uv==0.11.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eidolon_kernel*", "eidolon_system*", "eidolon_deploy*"]

[tool.setuptools.package-data]
"eidolon_kernel.contracts" = ["schemas/*/*.schema.json"]
"eidolon_system.contracts" = ["schemas/*/*.schema.json"]
"eidolon_deploy.contracts" = ["schemas/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: cross-package or real authority contract integration",
    "e2e: real process boundary exercised over HTTP or Unix sockets",
]

[tool.coverage.run]
branch = true
source = ["eidolon_kernel", "eidolon_system", "eidolon_deploy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
